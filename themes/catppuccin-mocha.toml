# Catppuccin Mocha — soothing pastel palette.
# Palette source: https://github.com/catppuccin/catppuccin
#
# Best for: anyone using a Catppuccin-themed terminal who wants the
# prompt to match. Requires a truecolor terminal.
#
# Install:
#   p10k-rs theme install catppuccin-mocha

schema_version = 1
mode = "nerd-font-v3"
colors = "true-color"
transient_prompt = "same-dir"

[layout]
left = ["context", "dir", "vcs", "prompt_char"]
right = ["status", "command_execution_time", "time"]

[layout.frame]
glyph = "╭─"
foreground = "#89b4fa"      # Blue

# Filled segments ride a single dark "Surface0" slate (#313244, one step
# up from Base) so the pastel foregrounds stay high-contrast and the
# powerline chevrons blend into one seamless dark ribbon. prompt_char
# stays unfilled.

[segment.context]
foreground = "#fab387"      # Peach
background = "#313244"      # Surface0

[segment.dir]
foreground = "#89b4fa"      # Blue
background = "#313244"      # Surface0

[segment.vcs]
foreground = "#a6e3a1"      # Green
background = "#313244"      # Surface0

[segment.vcs.states.dirty]
foreground = "#f9e2af"      # Yellow
background = "#313244"      # Surface0

[segment.prompt_char]
foreground = "#a6e3a1"

[segment.prompt_char.states.error]
foreground = "#f38ba8"      # Red

[segment.status.states.error]
foreground = "#f38ba8"
background = "#313244"      # Surface0

[segment.command_execution_time]
foreground = "#fab387"      # Peach
background = "#313244"      # Surface0

[segment.time]
# Overlay1 (#7f849c) is too dim on the Surface0 slate; Subtext0 reads.
foreground = "#a6adc8"      # Subtext0
background = "#313244"      # Surface0
