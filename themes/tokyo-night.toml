# Tokyo Night — cool nightscape palette.
# Palette source: https://github.com/enkia/tokyo-night-vscode-theme
#
# Best for: night sessions, matches popular Tokyo Night terminal +
# editor schemes.
#
# Install:
#   p10k-rs theme install tokyo-night

schema_version = 1
mode = "nerd-font-v3"
colors = "true-color"
transient_prompt = "same-dir"

[layout]
left = ["context", "dir", "vcs", "prompt_char"]
right = ["status", "command_execution_time", "time"]

[layout.frame]
glyph = "╭─"
foreground = "#7aa2f7"

# Filled segments ride a single dark "bg_highlight" slate (#24283b) so
# the pastel foregrounds stay high-contrast and the powerline chevrons
# blend into one seamless dark ribbon. prompt_char stays unfilled.

[segment.context]
foreground = "#ff9e64"
background = "#24283b"

[segment.dir]
foreground = "#7aa2f7"
background = "#24283b"

[segment.vcs]
foreground = "#9ece6a"
background = "#24283b"

[segment.vcs.states.dirty]
foreground = "#e0af68"
background = "#24283b"

[segment.prompt_char]
foreground = "#9ece6a"

[segment.prompt_char.states.error]
foreground = "#f7768e"

[segment.status.states.error]
foreground = "#f7768e"
background = "#24283b"

[segment.command_execution_time]
foreground = "#ff9e64"
background = "#24283b"

[segment.time]
# #565f89 ("comment") is too dim on the slate chip; "fg_dark" reads.
foreground = "#7982a9"
background = "#24283b"
