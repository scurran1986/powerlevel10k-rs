# Lean — single-line minimal, no frame, no powerline ribbons.
#
# Best for: dumb terminals, low-distraction setups, anyone who finds the
# default two-line frame too busy.
#
# Install:
#   p10k-rs theme install lean
# Or manually:
#   cp themes/lean.toml ~/.config/p10k-rs/config.toml

schema_version = 1
mode = "compatible"
colors = "follow_terminal"
transient_prompt = "off"

[layout]
left = ["dir", "vcs", "prompt_char"]
right = ["status", "command_execution_time", "time"]

# `background = "none"` opts each segment out of the chip fill so this
# theme renders truly flat — coloured text on the terminal's own
# background, no powerline arrows. Segment-level "none" also covers each
# segment's state variants (e.g. vcs dirty). prompt_char is already
# unfilled.

[segment.dir]
foreground = "blue"
background = "none"

[segment.vcs]
foreground = "green"
background = "none"

[segment.vcs.states.dirty]
foreground = "yellow"

[segment.prompt_char]
foreground = "green"

[segment.prompt_char.states.error]
foreground = "red"

[segment.status]
background = "none"

[segment.status.states.error]
foreground = "red"

[segment.command_execution_time]
foreground = "yellow"
background = "none"

[segment.time]
foreground = "white"
background = "none"
