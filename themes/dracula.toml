# Dracula — high-contrast purple-tinted dark palette.
# Palette source: https://draculatheme.com/contribute
#
# Best for: anyone running the Dracula terminal/editor theme. Truecolor
# recommended.
#
# Install:
#   p10k-rs theme install dracula

schema_version = 1
mode = "nerd-font-v3"
colors = "true-color"
transient_prompt = "same-dir"

[layout]
left = ["context", "dir", "vcs", "prompt_char"]
right = ["status", "command_execution_time", "time"]

[layout.frame]
glyph = "╭─"
foreground = "#bd93f9"      # purple

# Filled segments ride a single dark "Current Line" surface (#44475a)
# so the pink/purple/green/cyan foregrounds stay high-contrast and the
# powerline chevrons blend into one seamless dark ribbon. prompt_char
# stays unfilled.

[segment.context]
foreground = "#ffb86c"      # orange
background = "#44475a"

[segment.dir]
foreground = "#8be9fd"      # cyan
background = "#44475a"

[segment.vcs]
foreground = "#50fa7b"      # green
background = "#44475a"

[segment.vcs.states.dirty]
foreground = "#f1fa8c"      # yellow
background = "#44475a"

[segment.prompt_char]
foreground = "#50fa7b"

[segment.prompt_char.states.error]
foreground = "#ff5555"      # red

[segment.status.states.error]
foreground = "#ff5555"
background = "#44475a"

[segment.command_execution_time]
foreground = "#ffb86c"      # orange
background = "#44475a"

[segment.time]
# #6272a4 ("comment") is too dim on the surface chip; "foreground" reads.
foreground = "#f8f8f2"      # foreground
background = "#44475a"
