[package]
name = "p10k-rs-config"
description = "TOML configuration schema and Powerlevel9k import for p10k-rs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
# `geteuid()` + `OFlags::NOFOLLOW` for the T1.13 TOCTOU-safe config open.
# Already in `p10k-rs-core` / `p10k-rs-git`; adding it here keeps the inline
# helper unsafe-free without inverting the `core → config` dep direction.
rustix = { workspace = true }

[dev-dependencies]
# `insta` powers the schema-freeze snapshot tests in
# `tests/schema_snapshot.rs`. They complement `cargo-semver-checks`:
# the gate guards the public Rust API; the snapshot guards the
# user-visible TOML surface (default values, enum tag spellings,
# field names under `#[serde(rename)]`) so an accidental serde-only
# break surfaces as a diff rather than a silent rename.
insta = { workspace = true }

[lints]
workspace = true
