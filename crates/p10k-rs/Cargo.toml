[package]
name = "p10k-rs"
description = "A Rust port and spiritual successor to Powerlevel10k. Single static prompt binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "p10k-rs"
path = "src/main.rs"

[dependencies]
# Internal crates wire in as their respective subcommands light up.
p10k-rs-core = { workspace = true }
p10k-rs-config = { workspace = true }
p10k-rs-git = { workspace = true }
p10k-rs-jj = { workspace = true }
p10k-rs-segments = { workspace = true }
p10k-rs-shell = { workspace = true }
p10k-rs-wizard = { workspace = true }
p10k-rs-ai = { workspace = true }

clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
# Used by `todays_log_path` to compute the same UTC `YYYY-MM-DD`
# filename suffix tracing-appender's daily rotation writes to, so the
# binary can locate the freshly-rolled diagnostics file and chmod it
# `0o600`. Already a workspace dep via the `time` segment.
time = { workspace = true }
# Used solely for the portable `OFlags::NOFOLLOW` constant on the
# instant-prompt dump write. Already pulled transitively by p10k-rs-core /
# p10k-rs-git, so no new bytes in the dep tree.
rustix = { workspace = true }
# Slice 32: per-segment cwd gating via `show_in_dir` / `disabled_dir_pattern`.
# `globset` is the standard Rust glob library (used by ripgrep, cargo-edit,
# watchexec, etc.; ~hundreds of reverse-deps on crates.io) and compiles each
# pattern to an Aho-Corasick / regex matcher we evaluate against the cwd
# string. We could hand-roll a `*`/`**`/`?` matcher in ~50 LOC, but the
# semantics users expect ("does this look like my .gitignore?") match
# globset exactly. Keeping the dep in the binary crate only — the config
# crate stays glob-impl-agnostic so a future swap costs one file.
globset = "0.4"
# T0.5: `p10k-rs verify` re-hashes the gitstatusd helper on disk and
# compares it to the committed pin (see `crates/p10k-rs-git/data/gitstatusd-pins.toml`).
# `sha2` from the RustCrypto suite is the standard pure-Rust SHA-256
# implementation. Streamed hashing keeps memory flat on a multi-MB binary.
sha2 = { workspace = true }
# v0.2 Phase 5: `prompt --json` emits a structured payload that AI hosts
# and integration partners can consume. Workspace-level `serde` /
# `serde_json` already power the `p10k-rs-ai` statusline parser and the
# config crate's TOML schema — re-using them here adds no new
# transitive surface to the binary.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
