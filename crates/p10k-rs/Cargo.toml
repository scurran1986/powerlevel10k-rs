[package]
name = "p10k-rs"
description = "A Rust port and spiritual successor to Powerlevel10k. Single static prompt binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "p10k-rs"
path = "src/main.rs"

[dependencies]
# Internal crates wire in as their respective subcommands light up.
p10k-rs-core = { workspace = true }
p10k-rs-config = { workspace = true }
p10k-rs-git = { workspace = true }
p10k-rs-segments = { workspace = true }
p10k-rs-shell = { workspace = true }
p10k-rs-wizard = { workspace = true }
p10k-rs-ai = { workspace = true }

clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Slice 32: per-segment cwd gating via `show_in_dir` / `disabled_dir_pattern`.
# `globset` is the standard Rust glob library (used by ripgrep, cargo-edit,
# watchexec, etc.; ~hundreds of reverse-deps on crates.io) and compiles each
# pattern to an Aho-Corasick / regex matcher we evaluate against the cwd
# string. We could hand-roll a `*`/`**`/`?` matcher in ~50 LOC, but the
# semantics users expect ("does this look like my .gitignore?") match
# globset exactly. Keeping the dep in the binary crate only — the config
# crate stays glob-impl-agnostic so a future swap costs one file.
globset = "0.4"

[lints]
workspace = true
