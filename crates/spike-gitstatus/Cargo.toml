#
# spike-gitstatus — Day-1 latency spike for the gitstatusd replacement.
#
# This crate is *throwaway*. Its job is to answer one question, with numbers:
#   "Can we get within ~2x of gitstatusd's latency on a clean chromium repo
#    using `gix` + a custom rustix walker, or do we need to pivot?"
#
# See `.planning/powerlevel10k-rs/MVP-SPEC.md` § "Day-1 Spike" and
# `.planning/powerlevel10k-rs/07-gitstatus.md` § "Performance recipe".
#
# This crate does NOT ship in v0.1. The shippable code lives in `p10k-rs-git`,
# which copies the winning approach from this spike's verdict.
#
[package]
name = "spike-gitstatus"
description = "Day-1 latency spike: gix vs hybrid vs gitstatusd, criterion-driven."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "spike_gitstatus"
path = "src/lib.rs"

[[bin]]
name = "spike-gitstatus"
path = "src/main.rs"

[[bench]]
name = "status_bench"
harness = false

# Local lint relaxations — the spike is exploratory and `unwrap_used` is
# noisy in a binary main. The hygiene gates apply to shippable crates only.
[lints.clippy]
pedantic = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
todo = "allow"
# `gix::open::Error` is ~128 bytes, which trips `result_large_err` everywhere we
# return a `Result<_, SpikeError>`. Boxing it would make the throwaway spike
# uglier without changing what the bench measures. Production code in
# `p10k-rs-git` will box; this crate doesn't ship.
result_large_err = "allow"

[lints.rust]
missing_docs = "allow"
# This crate has the only documented `unsafe` blocks in the workspace.
# They live in `hybrid.rs`'s syscall wrappers and are gated by `// SAFETY:`
# comments. Library code outside that file must remain safe.
unsafe_code = "allow"

[dependencies]
# Shared.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
rustix = { workspace = true }
gix = { workspace = true }

# Spike-only / shared-but-rare. Pulled from the workspace so future crates
# (e.g. `p10k-rs-git`) inherit the same pin without re-declaring.
bincode = { workspace = true }
humantime = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
