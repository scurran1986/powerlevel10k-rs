[package]
name = "p10k-rs-git"
description = "gitstatusd daemon client + git shell-out fallback (ADR-0001)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
p10k-rs-core = { workspace = true }
rustix = { workspace = true } # used by gitstatusd backend for poll-with-timeout
thiserror = { workspace = true } # typed errors on the ShellOut spawn path (T0.4)
# T0.5: typed view over the committed gitstatusd sha256 pin file. The
# TOML is intentionally flat so the bash side in `install.sh` reads it
# with `awk`; on the Rust side we deserialise it via serde+toml so
# `p10k-rs verify` shares a single source of truth with the installer.
serde = { workspace = true }
toml = { workspace = true }
# Slice 60: gitoxide for the pure-Rust git-status fallback
# (`GixBackend`). Phase 2 lands `gix` with default features off
# — branch + HEAD lookup only, no status iteration yet. Phases
# 3-4 will add `status` and `revision` features incrementally.
gix = { workspace = true }

[dev-dependencies]
# Slice 60 phase 6: criterion bench comparing GixBackend vs ShellOut
# latency on the workspace itself. `html_reports` comes through the
# workspace-pinned feature set; the bench harness itself is the
# standard `criterion_main!` skeleton (see `benches/git_backend.rs`).
criterion = { workspace = true }

[[bench]]
name = "git_backend"
# `harness = false` is criterion's required incantation — its own
# `criterion_main!` macro provides the entry point in place of
# libtest's default harness.
harness = false

[lints]
workspace = true
