# gitstatusd binary pins for the T0.5 supply-chain hardening slice.
#
# Single source of truth for `install.sh` (download + verify) and the
# `p10k-rs verify` subcommand (re-hash the on-disk binary). Bumps land
# via the `.github/workflows/pin-gitstatusd.yml` weekly probe PR.
#
# IMPORTANT: the maintainer requested pinning v1.5.5. Upstream's v1.5.5
# GitHub release ships only `.asc` signature files — no per-arch
# binaries. The romkatv/gitstatus `install.info` (the source of truth
# the upstream install script consumes) still points each of our four
# triples at v1.5.4 binaries. Pinning v1.5.5 here would 404 every
# install. Stay on v1.5.4 (matches what brew / apt / nix all ship as
# of 2026-05-21); the pin-probe workflow will surface a v1.5.6 (or a
# late-uploaded v1.5.5 binary set) the moment upstream publishes one.
version = "v1.5.4"

# Upstream URL template the install script expands:
#   https://github.com/romkatv/gitstatus/releases/download/{version}/{file}.tar.gz
#
# Each tarball contains exactly one ELF/Mach-O binary at the top level,
# named the same as the file stem.
#
# `triple` is the public key (stable: `<arch>-<os>-<abi>` matching
# rustc's target-triple shape). `upstream_file` is what upstream
# actually publishes (`gitstatusd-<uname_s>-<uname_m>`). Keeping both
# means a future upstream rename costs one line per arch here, no
# install.sh churn.

[pins.x86_64-linux-gnu]
upstream_file = "gitstatusd-linux-x86_64"
# sha256 of the released `.tar.gz` archive — verified by install.sh
# before extraction.
tarball_sha256 = "9633816e7832109e530c9e2532b11a1edae08136d63aa7e40246c0339b7db304"
# sha256 of the extracted binary — verified by `p10k-rs verify` on
# the on-disk artifact at runtime.
binary_sha256 = "02b7bc11a70a68e484c44e3c7e4da1ed403c7b74a94a2b1e169266ea10460c79"

[pins.aarch64-linux-gnu]
upstream_file = "gitstatusd-linux-aarch64"
tarball_sha256 = "32b57eb28bf6d80b280e4020a0045184f8ca897b20b570c12948aa6838673225"
binary_sha256 = "85dd90a716c7be9fc2a22f1133147c954c73ea641f2cf84076228ed3835d5ddd"

[pins.x86_64-darwin]
upstream_file = "gitstatusd-darwin-x86_64"
tarball_sha256 = "9fd3913ec1b6b856ab6e08a99a2343f0e8e809eb6b62ca4b0963163656c668e6"
binary_sha256 = "8ab0bcf7f205b75388f65c032f57b3162f8655f2d434f0d517c867aa3a4d61a5"

[pins.aarch64-darwin]
upstream_file = "gitstatusd-darwin-arm64"
tarball_sha256 = "eae979e990ca37c56ee39fadd0c3f392cbbd0c6bdfb9a603010be60d9e48910a"
binary_sha256 = "2a04838261540f0d1c84f36899ba6b8a325faa6ab7042f1323a8faaca9933b22"
