#
# p10k-rs workspace
#
# A Rust port / spiritual successor to Powerlevel10k. See:
#   - .planning/powerlevel10k-rs/MVP-SPEC.md
#   - .planning/powerlevel10k-rs/ARCHITECTURE.md
#   - .planning/powerlevel10k-rs/09-rust-ecosystem.md
#
# Layout follows ARCHITECTURE.md § 1. `crates/spike-gitstatus` was the day-1
# latency spike; it discharged its purpose at slice-final and was removed in
# slice 9 per ADR-0001 § Follow-ups.
#
[workspace]
resolver = "2"
members = [
    "crates/p10k-rs",
    "crates/p10k-rs-core",
    "crates/p10k-rs-config",
    "crates/p10k-rs-segments",
    "crates/p10k-rs-git",
    "crates/p10k-rs-jj",
    "crates/p10k-rs-shell",
    "crates/p10k-rs-wizard",
    "crates/p10k-rs-ai",
    "crates/p10k-rs-ipc",
]

# Shared metadata. Individual crate manifests inherit via `package.<key>.workspace = true`.
[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["The p10k-rs contributors"]
repository = "https://github.com/scurran1986/powerlevel10k-rs"
homepage = "https://github.com/scurran1986/powerlevel10k-rs"
documentation = "https://github.com/scurran1986/powerlevel10k-rs"
readme = "README.md"
keywords = ["prompt", "shell", "zsh", "fish", "bash"]
categories = ["command-line-utilities"]

# Centralised dependency versions. Crates pull these in via `dep.workspace = true`.
# Conservative pinning to the minor (caret-default `^x.y`); update via PR with rationale.
#
# TODO(adviser): edition is 2021 because MSRV stable-2 (~1.84 as of May 2026) does not
# permit edition 2024 with the default features we want from `clap` and `gix`. Revisit
# once MSRV ratchets to 1.87+.
[workspace.dependencies]
# --- core / general ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0" # binary glue only — never in libraries
# `sha2` powers the T0.5 `p10k-rs verify` subcommand — re-hashes the
# gitstatusd helper on disk and compares against the committed pin in
# `crates/p10k-rs-git/data/gitstatusd-pins.toml`. The RustCrypto crate
# is the standard pure-Rust sha2 implementation (used by cargo, rustup,
# git2-rs, etc.). Tiny transitive surface (digest + generic-array +
# crypto-common + cpufeatures). MSRV-clean at 1.88.
sha2 = "0.10"

# Slice 60: gitoxide for the pure-Rust git-status fallback.
#
# Empirical research (scratch project under /tmp/gix-probe at
# slice-60 phase 2 time) settled the design-doc question of
# "scoped subcrates vs full umbrella":
#
# - Scoped full set (gix-hash + gix-discover + gix-ref +
#   gix-status + gix-revision + gix-config): +53 new packages
#   above the workspace baseline. Requires a gix-hash workaround
#   (its `Kind` enum has variants gated behind `sha1`/`sha256`
#   features that downstream doesn't enable, so a transitive-only
#   pull blows up; we'd have to add gix-hash as a direct workspace
#   dep with `features = ["sha1"]`).
# - Umbrella with `default-features = false`: +51 new packages,
#   no gix-hash workaround needed, cleaner high-level API.
#
# Umbrella wins on both axes. Features are added per slice-60
# phase as they're needed: phase 2 (branch + HEAD) needs nothing;
# phase 3 (status iteration) will add `features = ["status"]`;
# phase 4 (ahead/behind) will add `features = ["revision"]`.
# Bumped as a single dep — gitoxide is pre-1.0 so version is
# exact-pinned and bumps are reviewed.
gix = { version = "=0.83.0", default-features = false, features = ["sha1", "status"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Daily-rotating file appender + non-blocking writer for the diagnostics
# log (T1.21). Companion crate to `tracing-subscriber`, same upstream
# (tokio-rs/tracing), MSRV-clean at 1.88. Pulls only `time` (already in
# our tree for the `time` segment) and `crossbeam-channel` for the
# background writer thread — no surprise transitives.
tracing-appender = "0.2"

# --- Unicode safety (T1.10, slice α) ---
# `unicode-normalization` lets the render-path chokepoint NFC-normalise
# attacker-controlled text so visually-identical decomposed sequences
# can't bypass equality / display assertions. `unicode-segmentation`
# powers grapheme-boundary truncation in `SafeText::from_untrusted_with_cap`
# so oversized branch names don't slice combining marks or ZWJ clusters
# mid-glyph. Both crates are unicode-rs maintained, MSRV-clean at 1.88,
# wide reverse-dep counts.
unicode-normalization = "0.1"
unicode-segmentation = "1.12"

# --- CLI / styling ---
clap = { version = "4.5", features = ["derive", "cargo", "env", "wrap_help"] }
anstyle = "1.0"
crossterm = "0.28"

# --- I/O / parallelism ---
rayon = "1.10"
rustix = { version = "0.38", features = ["fs", "process", "event", "system", "termios", "stdio", "pipe"] }

# --- time formatting (slice 17: `time` segment) ---
# `local-offset` lets us resolve the user's tz on Linux/macOS; on Linux the
# crate's localtime_r call is safe in single-threaded processes (which we are
# per `[profile.release].codegen-units = 1` + no tokio). The crate returns
# Err(_) if multi-threading is detected at runtime, and our segment falls
# back to UTC in that case so a wedged tz lookup can't break the prompt.
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

# --- dev / test ---
insta = { version = "1.40", features = ["yaml"] }
criterion = { version = "0.5", features = ["html_reports"] }
# `gix`, `bincode`, `humantime`, `tempfile` were spike-only and went away
# with the spike crate in slice 9. They will come back individually if a
# `gix-status` correctness fallback or daemon-respawn cache lands.

# Internal crates — referenced via `path` so cargo resolves locally.
p10k-rs-core = { path = "crates/p10k-rs-core", version = "0.2.2" }
p10k-rs-config = { path = "crates/p10k-rs-config", version = "0.2.2" }
p10k-rs-segments = { path = "crates/p10k-rs-segments", version = "0.2.2" }
p10k-rs-git = { path = "crates/p10k-rs-git", version = "0.2.2" }
p10k-rs-jj = { path = "crates/p10k-rs-jj", version = "0.2.2" }
p10k-rs-shell = { path = "crates/p10k-rs-shell", version = "0.2.2" }
p10k-rs-wizard = { path = "crates/p10k-rs-wizard", version = "0.2.2" }
p10k-rs-ai = { path = "crates/p10k-rs-ai", version = "0.2.2" }
p10k-rs-ipc = { path = "crates/p10k-rs-ipc", version = "0.2.2" }

# Workspace-wide lints. Crates opt in via `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "warn"           # crates that need unsafe (only `p10k-rs-git`) override locally
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Pedantic exclusions — these fire too often on legitimate code to be useful as walls.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow" # transitive duplicates we don't control
# `bg`/`fg`, `default_bg`/`default_fg` are the domain-natural pair for every
# prompt segment; the lint flags them as too similar but renaming hurts
# readability more than it helps.
similar_names = "allow"
# Hard denials — these are bugs, not style.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
# `lto = "fat"`: trade link time for tighter codegen and a smaller
# stripped binary. The binary's fork+exec cost scales linearly with
# ELF size (page-mapping + dynamic-linker work), and that floor is the
# dominant warm-path term on every prompt invocation per agent 03's
# bench (~605 µs of a 1.5 ms total on WSL2). Slice G first pass.
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1
