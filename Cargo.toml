#
# p10k-rs workspace
#
# A Rust port / spiritual successor to Powerlevel10k. See:
#   - .planning/powerlevel10k-rs/MVP-SPEC.md
#   - .planning/powerlevel10k-rs/ARCHITECTURE.md
#   - .planning/powerlevel10k-rs/09-rust-ecosystem.md
#
# Layout follows ARCHITECTURE.md § 1. `crates/spike-gitstatus` was the day-1
# latency spike; it discharged its purpose at slice-final and was removed in
# slice 9 per ADR-0001 § Follow-ups.
#
[workspace]
resolver = "2"
members = [
    "crates/p10k-rs",
    "crates/p10k-rs-core",
    "crates/p10k-rs-config",
    "crates/p10k-rs-segments",
    "crates/p10k-rs-git",
    "crates/p10k-rs-jj",
    "crates/p10k-rs-shell",
    "crates/p10k-rs-wizard",
    "crates/p10k-rs-ai",
    "crates/p10k-rs-ipc",
]

# Shared metadata. Individual crate manifests inherit via `package.<key>.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["The p10k-rs contributors"]
repository = "https://github.com/seaburdz/powerlevel10k-rs"
homepage = "https://github.com/seaburdz/powerlevel10k-rs"
documentation = "https://github.com/seaburdz/powerlevel10k-rs"
readme = "README.md"
keywords = ["prompt", "shell", "zsh", "fish", "bash"]
categories = ["command-line-utilities"]

# Centralised dependency versions. Crates pull these in via `dep.workspace = true`.
# Conservative pinning to the minor (caret-default `^x.y`); update via PR with rationale.
#
# TODO(adviser): edition is 2021 because MSRV stable-2 (~1.84 as of May 2026) does not
# permit edition 2024 with the default features we want from `clap` and `gix`. Revisit
# once MSRV ratchets to 1.87+.
[workspace.dependencies]
# --- core / general ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0" # binary glue only — never in libraries
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- CLI / styling ---
clap = { version = "4.5", features = ["derive", "cargo", "env", "wrap_help"] }
anstyle = "1.0"
crossterm = "0.28"

# --- I/O / parallelism ---
rayon = "1.10"
rustix = { version = "0.38", features = ["fs", "process", "event", "system", "termios", "stdio", "pipe"] }

# --- time formatting (slice 17: `time` segment) ---
# `local-offset` lets us resolve the user's tz on Linux/macOS; on Linux the
# crate's localtime_r call is safe in single-threaded processes (which we are
# per `[profile.release].codegen-units = 1` + no tokio). The crate returns
# Err(_) if multi-threading is detected at runtime, and our segment falls
# back to UTC in that case so a wedged tz lookup can't break the prompt.
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

# --- dev / test ---
insta = { version = "1.40", features = ["yaml"] }
criterion = { version = "0.5", features = ["html_reports"] }
# `gix`, `bincode`, `humantime`, `tempfile` were spike-only and went away
# with the spike crate in slice 9. They will come back individually if a
# `gix-status` correctness fallback or daemon-respawn cache lands.

# Internal crates — referenced via `path` so cargo resolves locally.
p10k-rs-core = { path = "crates/p10k-rs-core", version = "0.1.0" }
p10k-rs-config = { path = "crates/p10k-rs-config", version = "0.1.0" }
p10k-rs-segments = { path = "crates/p10k-rs-segments", version = "0.1.0" }
p10k-rs-git = { path = "crates/p10k-rs-git", version = "0.1.0" }
p10k-rs-jj = { path = "crates/p10k-rs-jj", version = "0.1.0" }
p10k-rs-shell = { path = "crates/p10k-rs-shell", version = "0.1.0" }
p10k-rs-wizard = { path = "crates/p10k-rs-wizard", version = "0.1.0" }
p10k-rs-ai = { path = "crates/p10k-rs-ai", version = "0.1.0" }
p10k-rs-ipc = { path = "crates/p10k-rs-ipc", version = "0.1.0" }

# Workspace-wide lints. Crates opt in via `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "warn"           # crates that need unsafe (only `p10k-rs-git`) override locally
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Pedantic exclusions — these fire too often on legitimate code to be useful as walls.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow" # transitive duplicates we don't control
# `bg`/`fg`, `default_bg`/`default_fg` are the domain-natural pair for every
# prompt segment; the lint flags them as too similar but renaming hurts
# readability more than it helps.
similar_names = "allow"
# Hard denials — these are bugs, not style.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
