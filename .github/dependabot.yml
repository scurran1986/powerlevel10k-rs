version: 2
updates:
  # Cargo deps for the workspace root. Single PR per week; group patch+minor to
  # keep noise down. Major bumps come as their own PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: deps
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  # GitHub Actions used by ci.yml, release.yml, docs.yml. Pins are
  # SHA-based (see workflow `uses:` lines); Dependabot reads the
  # trailing `# vX.Y.Z` comment to know the current release and
  # auto-PRs the new SHA + updated comment when upstream ships.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
      include: scope
    # dtolnay/rust-toolchain is tagged by *Rust version*, not action
    # semver: `@1.88.0` deliberately pins the MSRV gate to Rust 1.88.0.
    # Dependabot misreads those tags as releases and "bumps" the pin to
    # a nonexistent toolchain (e.g. 1.100.0 → 404). Ignore it; the MSRV
    # ref is moved by hand when the policy floor changes.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      patch-and-minor:
        update-types: [patch, minor]
