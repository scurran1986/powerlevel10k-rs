name: release

# Triggered when a maintainer pushes a semver tag (`v0.1.0`, `v0.2.0-rc1`,
# etc.). Builds release binaries for the supported triples in parallel,
# tars them with the LICENSE / README / THIRD-PARTY-LICENSES files, and
# uploads them as assets on the corresponding GitHub release.
#
# Manual trigger via `workflow_dispatch` is supported for testing —
# uploads still attach to the most-recent release matching `$REF_NAME`,
# so don't manually-trigger against a non-release ref unless you know
# what you're doing.

on:
  push:
    # Restrict to semver-shaped tags. "v*" would also match `v-test`,
    # `vendor-bump`, etc. and accidentally trigger a release upload.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

# One release per ref. cancel-in-progress is OFF on purpose: a release
# part-way through publishing assets should finish, not be torn down by
# a re-trigger.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write     # creating the release + uploading assets
  id-token: write     # sigstore OIDC (cosign sign-blob + attest-build-provenance)
  attestations: write # SLSA build-provenance generation

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Both darwin arches build on the macos-14 (Apple Silicon)
          # runner. The macos-13 (Intel) runner pool is so backlogged
          # in 2026 that the previous configuration hit GitHub's 24h
          # queue timeout on the x86_64-darwin job every release. The
          # Apple Silicon runner ships the Xcode SDK plus rustc's
          # x86_64-apple-darwin target, so a normal cross-compile
          # works — `cross: false` because rustc + the macOS linker
          # handle x86_64 emission without an external toolchain.
          - target: x86_64-apple-darwin
            os: macos-14
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The repo's `rust-toolchain.toml` pins 1.88. The action installs
      # the `stable` toolchain by default; without the explicit `target`
      # on *that* channel cargo would still then read `rust-toolchain.toml`
      # and try to use 1.88 — which doesn't have the cross-compile target
      # registered. Installing the target on the pinned toolchain
      # explicitly fixes the v0.1.1 release-workflow failure
      # ("can't find crate for `std`" + "target may not be installed").
      - uses: dtolnay/rust-toolchain@stable
      - name: install pinned toolchain + cross target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ matrix.target }}

      # Cross-compile prerequisites for aarch64 Linux. Native targets (x86_64
      # Linux, both Darwin triples) build with the toolchain's default linker.
      - name: install cross-compiler (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: build (release)
        run: cargo build --release --locked --target ${{ matrix.target }} --bin p10k-rs

      - name: strip (unix)
        if: matrix.cross == false
        run: strip target/${{ matrix.target }}/release/p10k-rs

      - name: strip (cross aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: aarch64-linux-gnu-strip target/${{ matrix.target }}/release/p10k-rs

      - name: package
        id: package
        run: |
          set -euo pipefail
          # `github.ref_name` is the tag (`v0.1.0`) on a push:tags event;
          # for workflow_dispatch on a branch it's the branch name, which
          # we still tarball under for testing.
          version="${GITHUB_REF_NAME#v}"
          stage="p10k-rs-${version}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/p10k-rs" "$stage/"
          cp LICENSE-MIT LICENSE-APACHE README.md THIRD-PARTY-LICENSES.md "$stage/" 2>/dev/null || true
          tar czf "${stage}.tar.gz" "$stage"
          # `sha256sum` is GNU coreutils only — macOS ships BSD `shasum`
          # under a different name. Branch on availability so the same
          # release.yml works on both runner families.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          else
            shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          fi
          echo "asset=${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "shasum=${stage}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      # Sigstore keyless signing. The OIDC token GitHub Actions issues
      # binds to this workflow file + ref, so verifiers can prove the
      # tarball came from a build of this repo at this tag — not just
      # that it hashes to a value we also published.
      # Gated on tag push: workflow_dispatch on a branch would produce
      # a signature claiming a branch identity, pollute Rekor, and
      # provide no value.
      - name: install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.2
        with:
          cosign-release: "v2.5.0"

      - name: sign tarball (sigstore keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_YES: "true" # auto-accept the Rekor transparency-log upload
        run: |
          cosign sign-blob \
            --bundle "${{ steps.package.outputs.asset }}.cosign.bundle" \
            "${{ steps.package.outputs.asset }}"

      # SLSA-style build-provenance attestation. Attests both the
      # unpacked binary and the tarball so downstream verifiers can
      # `gh attestation verify` either artifact directly:
      #   gh attestation verify p10k-rs-<v>-<triple>.tar.gz \
      #     --repo seaburdz/powerlevel10k-rs
      # Once signed tags land (separate slice), this combination
      # qualifies as SLSA L3 per slsa.dev/spec/v1.0.
      - name: attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            target/${{ matrix.target }}/release/p10k-rs
            ${{ steps.package.outputs.asset }}

      - name: upload artifacts (workflow run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.shasum }}

      - name: locate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::no release notes at $notes — release body will be empty"
          fi

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.shasum }}
            ${{ steps.package.outputs.asset }}.cosign.bundle
          # body_path is optional — empty when no per-version notes file
          # exists. Don't auto-generate from commits: the maintainer's
          # version-pinned notes file is the source of truth.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
