name: release

# Triggered when a maintainer pushes a semver tag (`v0.1.0`, `v0.2.0-rc1`,
# etc.). Builds release binaries for the supported triples in parallel,
# tars them with the LICENSE / README / THIRD-PARTY-LICENSES files, and
# uploads them as assets on the corresponding GitHub release.
#
# Manual trigger via `workflow_dispatch` is supported for testing —
# uploads still attach to the most-recent release matching `$REF_NAME`,
# so don't manually-trigger against a non-release ref unless you know
# what you're doing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # for creating the release + uploading assets

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Both darwin arches build on the macos-14 (Apple Silicon)
          # runner. The macos-13 (Intel) runner pool is so backlogged
          # in 2026 that the previous configuration hit GitHub's 24h
          # queue timeout on the x86_64-darwin job every release. The
          # Apple Silicon runner ships the Xcode SDK plus rustc's
          # x86_64-apple-darwin target, so a normal cross-compile
          # works — `cross: false` because rustc + the macOS linker
          # handle x86_64 emission without an external toolchain.
          - target: x86_64-apple-darwin
            os: macos-14
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
    steps:
      - uses: actions/checkout@v4

      # The repo's `rust-toolchain.toml` pins 1.88. The action installs
      # the `stable` toolchain by default; without the explicit `target`
      # on *that* channel cargo would still then read `rust-toolchain.toml`
      # and try to use 1.88 — which doesn't have the cross-compile target
      # registered. Installing the target on the pinned toolchain
      # explicitly fixes the v0.1.1 release-workflow failure
      # ("can't find crate for `std`" + "target may not be installed").
      - uses: dtolnay/rust-toolchain@stable
      - name: install pinned toolchain + cross target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compile prerequisites for aarch64 Linux. Native targets (x86_64
      # Linux, both Darwin triples) build with the toolchain's default linker.
      - name: install cross-compiler (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: build (release)
        run: cargo build --release --locked --target ${{ matrix.target }} --bin p10k-rs

      - name: strip (unix)
        if: matrix.cross == false
        run: strip target/${{ matrix.target }}/release/p10k-rs

      - name: strip (cross aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: aarch64-linux-gnu-strip target/${{ matrix.target }}/release/p10k-rs

      - name: package
        id: package
        run: |
          set -euo pipefail
          # `github.ref_name` is the tag (`v0.1.0`) on a push:tags event;
          # for workflow_dispatch on a branch it's the branch name, which
          # we still tarball under for testing.
          version="${GITHUB_REF_NAME#v}"
          stage="p10k-rs-${version}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/p10k-rs" "$stage/"
          cp LICENSE-MIT LICENSE-APACHE README.md THIRD-PARTY-LICENSES.md "$stage/" 2>/dev/null || true
          tar czf "${stage}.tar.gz" "$stage"
          # `sha256sum` is GNU coreutils only — macOS ships BSD `shasum`
          # under a different name. Branch on availability so the same
          # release.yml works on both runner families.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          else
            shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          fi
          echo "asset=${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "shasum=${stage}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.shasum }}

      - name: locate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::no release notes at $notes — release body will be empty"
          fi

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.shasum }}
          # body_path is optional — empty when no per-version notes file
          # exists. Don't auto-generate from commits: the maintainer's
          # version-pinned notes file is the source of truth.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
