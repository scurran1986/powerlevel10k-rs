name: release

# Triggered when a maintainer pushes a semver tag (`v0.1.0`, `v0.2.0-rc1`,
# etc.). Builds release binaries for the supported triples in parallel,
# tars them with the LICENSE / README / THIRD-PARTY-LICENSES files, and
# uploads them as assets on the corresponding GitHub release.
#
# Manual trigger via `workflow_dispatch` is supported for testing —
# uploads still attach to the most-recent release matching `$REF_NAME`,
# so don't manually-trigger against a non-release ref unless you know
# what you're doing.

on:
  push:
    # Restrict to semver-shaped tags. "v*" would also match `v-test`,
    # `vendor-bump`, etc. and accidentally trigger a release upload.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

# One release per ref. cancel-in-progress is OFF on purpose: a release
# part-way through publishing assets should finish, not be torn down by
# a re-trigger.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write     # creating the release + uploading assets
  id-token: write     # sigstore OIDC (cosign sign-blob + attest-build-provenance)
  attestations: write # SLSA build-provenance generation

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Both darwin arches build on the macos-14 (Apple Silicon)
          # runner. The macos-13 (Intel) runner pool is so backlogged
          # in 2026 that the previous configuration hit GitHub's 24h
          # queue timeout on the x86_64-darwin job every release. The
          # Apple Silicon runner ships the Xcode SDK plus rustc's
          # x86_64-apple-darwin target, so a normal cross-compile
          # works — `cross: false` because rustc + the macOS linker
          # handle x86_64 emission without an external toolchain.
          - target: x86_64-apple-darwin
            os: macos-14
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
          # Windows MSVC targets restored after the Windows portability
          # milestone phases 1+2+3 + 3b landed (cfg-gates across
          # p10k-rs-core, segments, gitstatusd, main). `cargo check
          # --target x86_64-pc-windows-msvc --workspace --locked` exits
          # 0 with zero warnings. aarch64-pc-windows-msvc cross-compiles
          # cleanly via `rustup target add` — MSVC's linker handles the
          # emission without an external toolchain.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The repo's `rust-toolchain.toml` pins 1.88. The action installs
      # the `stable` toolchain by default; without the explicit `target`
      # on *that* channel cargo would still then read `rust-toolchain.toml`
      # and try to use 1.88 — which doesn't have the cross-compile target
      # registered. Installing the target on the pinned toolchain
      # explicitly fixes the v0.1.1 release-workflow failure
      # ("can't find crate for `std`" + "target may not be installed").
      - uses: dtolnay/rust-toolchain@stable
      - name: install pinned toolchain + cross target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: ${{ matrix.target }}

      # Cross-compile prerequisites for aarch64 Linux. Native targets (x86_64
      # Linux, both Darwin triples) build with the toolchain's default linker.
      - name: install cross-compiler (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: build (release)
        run: cargo build --release --locked --target ${{ matrix.target }} --bin p10k-rs

      # Skip strip on Windows: MSVC `link.exe` handles symbol stripping
      # at link time and `strip` isn't on PATH on the windows-latest
      # runner. The `matrix.cross == false` gate already excluded the
      # cross-linux entry; the `runner.os != 'Windows'` gate excludes
      # the new windows-msvc entries.
      - name: strip (unix)
        if: matrix.cross == false && runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/p10k-rs

      - name: strip (cross aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: aarch64-linux-gnu-strip target/${{ matrix.target }}/release/p10k-rs

      - name: package (unix)
        if: runner.os != 'Windows'
        id: package_unix
        run: |
          set -euo pipefail
          # `github.ref_name` is the tag (`v0.1.0`) on a push:tags event;
          # for workflow_dispatch on a branch it's the branch name, which
          # we still tarball under for testing.
          version="${GITHUB_REF_NAME#v}"
          stage="p10k-rs-${version}-${{ matrix.target }}"
          mkdir -p "$stage" "$stage/man1"
          cp "target/${{ matrix.target }}/release/p10k-rs" "$stage/"
          cp LICENSE-MIT LICENSE-APACHE README.md THIRD-PARTY-LICENSES.md "$stage/" 2>/dev/null || true
          cp docs/man/p10k-rs.1 "$stage/man1/" 2>/dev/null || true
          tar czf "${stage}.tar.gz" "$stage"
          # `sha256sum` is GNU coreutils only — macOS ships BSD `shasum`
          # under a different name. Branch on availability so the same
          # release.yml works on both runner families.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          else
            shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          fi
          echo "asset=${stage}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "shasum=${stage}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      # Windows packaging: produce `${stage}.zip` (instead of `.tar.gz`)
      # via PowerShell's built-in `Compress-Archive`. No external tools
      # required, no `tar` quirks across Windows tar variants. The
      # `.sha256` sidecar uses `Get-FileHash` (SHA-256 by default) and is
      # formatted to match the `sha256sum`/`shasum -a 256` line format:
      # `<lowercase-hex>  <filename>\n`.
      - name: package (windows)
        if: runner.os == 'Windows'
        id: package_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $target = "${{ matrix.target }}"
          $stage = "p10k-rs-$version-$target"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$target/release/p10k-rs.exe" -Destination "$stage/"
          foreach ($f in @("LICENSE-MIT","LICENSE-APACHE","README.md","THIRD-PARTY-LICENSES.md")) {
            if (Test-Path $f) { Copy-Item $f -Destination "$stage/" }
          }
          $zip = "$stage.zip"
          $sha = "$stage.zip.sha256"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path $stage -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          # Match GNU `sha256sum` line format: "<hex>  <file>\n" (two spaces).
          Set-Content -Path $sha -Value ("$hash  $zip") -NoNewline
          Add-Content -Path $sha -Value "`n" -NoNewline
          "asset=$zip"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "shasum=$sha"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Unify outputs from the two packaging branches so downstream steps
      # don't have to keep branching. Exactly one of `package_unix` /
      # `package_windows` ran above; the other's outputs are empty.
      - name: collect package outputs
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ steps.package_unix.outputs.asset }}${{ steps.package_windows.outputs.asset }}"
          shasum="${{ steps.package_unix.outputs.shasum }}${{ steps.package_windows.outputs.shasum }}"
          echo "asset=$asset"   >> "$GITHUB_OUTPUT"
          echo "shasum=$shasum" >> "$GITHUB_OUTPUT"
          # `binpath` is the unstripped binary the attest step subjects;
          # `.exe` suffix on Windows.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "binpath=target/${{ matrix.target }}/release/p10k-rs.exe" >> "$GITHUB_OUTPUT"
          else
            echo "binpath=target/${{ matrix.target }}/release/p10k-rs" >> "$GITHUB_OUTPUT"
          fi

      # Sigstore keyless signing. The OIDC token GitHub Actions issues
      # binds to this workflow file + ref, so verifiers can prove the
      # tarball came from a build of this repo at this tag — not just
      # that it hashes to a value we also published.
      # Gated on tag push: workflow_dispatch on a branch would produce
      # a signature claiming a branch identity, pollute Rekor, and
      # provide no value.
      - name: install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.9.2
        with:
          cosign-release: "v2.5.0"

      # Sigstore signs whatever archive the OS-specific packaging step
      # produced — `.tar.gz` on unix, `.zip` on windows. `shell: bash`
      # is explicit so the same line-continuation syntax works on
      # windows-latest (Git Bash ships with the runner image).
      - name: sign archive (sigstore keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          COSIGN_YES: "true" # auto-accept the Rekor transparency-log upload
        run: |
          cosign sign-blob \
            --bundle "${{ steps.package.outputs.asset }}.cosign.bundle" \
            "${{ steps.package.outputs.asset }}"

      # SLSA-style build-provenance attestation. Attests both the
      # unpacked binary and the tarball so downstream verifiers can
      # `gh attestation verify` either artifact directly:
      #   gh attestation verify p10k-rs-<v>-<triple>.tar.gz \
      #     --repo seaburdz/powerlevel10k-rs
      # Once signed tags land (separate slice), this combination
      # qualifies as SLSA L3 per slsa.dev/spec/v1.0.
      - name: attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          # `binpath` resolves to `…/p10k-rs.exe` on windows runners and
          # `…/p10k-rs` elsewhere; `asset` is `.zip` or `.tar.gz` to
          # match. Verifiers can attest either artifact directly via
          # `gh attestation verify`.
          subject-path: |
            ${{ steps.package.outputs.binpath }}
            ${{ steps.package.outputs.asset }}

      - name: upload artifacts (workflow run)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.shasum }}

      - name: locate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        # Force bash on every runner — Windows defaults to PowerShell and
        # would choke on `[[ -f ... ]]`. v0.2.5 surfaced this: both
        # windows-msvc jobs failed at this step despite the build /
        # package / sign / attest steps succeeding. Git Bash ships on
        # windows-latest.
        shell: bash
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::no release notes at $notes — release body will be empty"
          fi

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.shasum }}
            ${{ steps.package.outputs.asset }}.cosign.bundle
          # body_path is optional — empty when no per-version notes file
          # exists. Don't auto-generate from commits: the maintainer's
          # version-pinned notes file is the source of truth.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false

  # SBOM (Software Bill of Materials) — single-shot, attached once per
  # release. `needs: build` ensures every per-target build finished and
  # the release exists before we upload; the SBOM itself is dep-tree
  # data, target-independent, so generating it once is correct.
  #
  # `cargo sbom` (cargo-sbom 0.10.x) emits SPDX 2.3 JSON over the
  # locked dependency graph. Same `contents: write` perm as the build
  # job inherits from the workflow-level permissions block above.
  sbom:
    name: sbom
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo install cargo-sbom --locked
      - name: generate SBOM
        run: cargo sbom > "p10k-rs-${{ github.ref_name }}.spdx.json"
      - name: attach SBOM to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: p10k-rs-${{ github.ref_name }}.spdx.json
