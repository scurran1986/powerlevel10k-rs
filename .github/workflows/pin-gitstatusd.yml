# Weekly probe for new upstream `romkatv/gitstatus` releases (T0.5).
#
# When a newer tag is published *and* the per-triple binaries we depend
# on are actually attached (some upstream tags ship signatures only —
# v1.5.5 was the motivating case), this workflow opens a PR updating
# `crates/p10k-rs-git/data/gitstatusd-pins.toml`. A maintainer reviews
# and merges; merging triggers no release pipeline, just lands a new
# sha set users can install against.
#
# Deliberately minimal: plain curl + sha256sum + gh. No third-party
# actions in the value chain other than checkout, which we need so
# the PR diff against the committed pins file is meaningful.
name: pin-gitstatusd

on:
  schedule:
    # Mondays at 14:00 UTC — early morning Pacific, picks up any
    # over-the-weekend upstream releases.
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    name: probe upstream and open PR on new release
    runs-on: ubuntu-latest
    env:
      UPSTREAM: romkatv/gitstatus
      PIN_FILE: crates/p10k-rs-git/data/gitstatusd-pins.toml
    steps:
      - uses: actions/checkout@v5

      - name: read currently-pinned version
        id: current
        run: |
          set -euo pipefail
          current=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' "$PIN_FILE")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "[info] currently pinned: $current"

      - name: resolve upstream latest tag
        id: upstream
        run: |
          set -euo pipefail
          latest=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$UPSTREAM/releases/latest" \
            | awk -F'"' '/"tag_name":/{print $4; exit}')
          if [ -z "$latest" ]; then
            echo "[error] could not resolve upstream latest tag" >&2
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "[info] upstream latest: $latest"

      - name: short-circuit when already current
        if: steps.current.outputs.current == steps.upstream.outputs.latest
        run: echo "[info] pin already matches upstream latest; nothing to do."

      - name: probe per-triple artifact availability
        id: probe
        if: steps.current.outputs.current != steps.upstream.outputs.latest
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.latest }}"
          base="https://github.com/$UPSTREAM/releases/download/$tag"
          # Mirror the pin table's per-triple upstream filenames. Keep this
          # list in sync with the [pins.<triple>] sections of the pin file.
          declare -A files=(
            [x86_64-linux-gnu]="gitstatusd-linux-x86_64"
            [aarch64-linux-gnu]="gitstatusd-linux-aarch64"
            [x86_64-darwin]="gitstatusd-darwin-x86_64"
            [aarch64-darwin]="gitstatusd-darwin-arm64"
          )
          missing=0
          for triple in "${!files[@]}"; do
            url="$base/${files[$triple]}.tar.gz"
            if ! curl -fsI -o /dev/null "$url"; then
              echo "[warn] $tag is missing binaries for $triple ($url)"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "[info] $tag ships signatures-only or partial binaries; skipping pin bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: rebuild pin file
        if: steps.current.outputs.current != steps.upstream.outputs.latest && steps.probe.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.latest }}"
          base="https://github.com/$UPSTREAM/releases/download/$tag"
          declare -A files=(
            [x86_64-linux-gnu]="gitstatusd-linux-x86_64"
            [aarch64-linux-gnu]="gitstatusd-linux-aarch64"
            [x86_64-darwin]="gitstatusd-darwin-x86_64"
            [aarch64-darwin]="gitstatusd-darwin-arm64"
          )
          tmp=$(mktemp -d)
          {
            echo "# gitstatusd binary pins for the T0.5 supply-chain hardening slice."
            echo "#"
            echo "# Regenerated by .github/workflows/pin-gitstatusd.yml."
            echo "# Source of truth for install.sh + \`p10k-rs verify\`."
            echo "version = \"$tag\""
            echo
          } > "$PIN_FILE.new"
          for triple in x86_64-linux-gnu aarch64-linux-gnu x86_64-darwin aarch64-darwin; do
            file="${files[$triple]}"
            url="$base/$file.tar.gz"
            curl -fsSL "$url" -o "$tmp/$file.tar.gz"
            tarball_sha=$(sha256sum "$tmp/$file.tar.gz" | awk '{print $1}')
            tar -xzf "$tmp/$file.tar.gz" -C "$tmp"
            binary_sha=$(sha256sum "$tmp/$file" | awk '{print $1}')
            {
              echo "[pins.$triple]"
              echo "upstream_file = \"$file\""
              echo "tarball_sha256 = \"$tarball_sha\""
              echo "binary_sha256 = \"$binary_sha\""
              echo
            } >> "$PIN_FILE.new"
          done
          mv "$PIN_FILE.new" "$PIN_FILE"
          rm -rf "$tmp"

      - name: open PR for the bump
        if: steps.current.outputs.current != steps.upstream.outputs.latest && steps.probe.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.latest }}"
          branch="pin-gitstatusd-$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$PIN_FILE"
          git commit -m "deps: bump pinned gitstatusd to $tag"
          git push -u origin "$branch"
          body=$(cat <<EOF
          Automated bump from the weekly upstream probe. Upstream tag \`$tag\` ships binaries for all four supported triples; per-triple sha256s recomputed from the tarballs.

          Reviewer checklist:
          - [ ] Read the upstream release notes for security-relevant changes.
          - [ ] Spot-check at least one sha against \`curl ... | sha256sum\`.
          - [ ] Run the install-test recipe in SECURITY.md.

          Closes the pin-cycle for $tag.
          EOF
          )
          # Strip the leading 10-space block-indent the heredoc preserves
          # so the rendered PR body is left-aligned.
          body=$(printf '%s\n' "$body" | sed 's/^          //')
          gh pr create \
            --title "deps: bump pinned gitstatusd to $tag" \
            --body "$body" \
            --label "deps,supply-chain"
