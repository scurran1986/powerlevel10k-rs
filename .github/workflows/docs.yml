name: docs

# Builds the mdBook site under `docs/` and publishes it to the
# `gh-pages` branch on every push to `main` (and on tag pushes).
#
# Pages settings:
#   Source: Deploy from a branch
#   Branch: gh-pages
#   Folder: / (root)
#
# (The `actions/deploy-pages` flow this workflow used to use
# requires Pages source = "GitHub Actions", a separate settings
# option from "Deploy from a branch". The gh-pages-branch
# approach plays nicer with the default branch-deploy UI most
# repos start with — a one-click switch from any other branch.)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # gh-pages branch push

# Node.js 24 forward-compat: the peaceiris/* actions still ship as
# Node.js 20 actions, which the GitHub runner is deprecating on
# 2026-09-16. Opt into Node.js 24 now so the workflow doesn't break
# the day the runner default flips. Drop this env block once both
# peaceiris actions ship Node.js 24-native major versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: build mdbook + push to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: install mdbook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: latest

      - name: build site
        run: mdbook build docs

      - name: publish to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          publish_branch: gh-pages
          force_orphan: true   # one-commit history on gh-pages — keeps the branch slim
          commit_message: "docs: publish ${{ github.sha }}"
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
